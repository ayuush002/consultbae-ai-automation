services:
  - type: web
    name: consultbae-ai-automation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app.api:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/consultbae.db
      - key: UPLOAD_FOLDER
        value: /tmp/consultbae-uploads
      - key: SECRET_KEY
        generateValue: true
